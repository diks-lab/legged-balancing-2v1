<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 LQR Logger</title><link rel="icon" href="data:,"></head>
<body><main><h1>ESP32 LQR Logger</h1><p>PS4を基本操作に使用します。Webは状態表示・停止後のログ取得用です。</p>
<p id="connection" role="status">HTML解析中…</p><pre id="status">状態取得はCSS・JSの準備後に開始します。</pre>
<h2>Trace CSV</h2><p>走行・倒立・直接駆動試験中は取得できません。転倒後の記録も取得できます。</p>
<nav><a href="/trace/velocity.csv">Velocity Trace</a><a href="/trace/loop.csv">Loop Timing Trace</a><a href="/trace/lqr.csv">LQR Control Trace</a></nav>
<h2>停止</h2><button data-command="stop">STOP TEST</button>
<details><summary>既存の診断操作</summary><p>停止状態で使用してください。受付と実行結果は異なります。状態表示で確認してください。</p>
<button data-command="mode">Change Mode</button><button data-command="speed-source">Change Speed Source</button><button data-command="start">START BALANCE TEST</button></details>
<p id="result" role="status"></p></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
  const message=document.getElementById('connection');
  let target='/style.css';
  async function asset(path){
    message.textContent=`取得中: ${path}`;
    const response=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(3000)});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    return await response.text();
  }
  try{
    const style=document.createElement('style');
    style.textContent=await asset(target);
    document.head.appendChild(style);
    target='/app.js';
    const script=document.createElement('script');
    script.textContent=await asset(target);
    document.head.appendChild(script);
    if(typeof window.startLogger!=='function')throw new Error('JSの準備が完了しませんでした');
    target='JS初期化';
    window.startLogger();
  }catch(error){
    message.textContent=`取得・準備失敗: ${target}: ${error.message}。自動再試行はしません。ページを再読み込みしてください。`;
  }
},{once:true});
</script></body></html>
