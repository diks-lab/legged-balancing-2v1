[env:esp32dev]
extra_scripts =
  pre:scripts/check_http_client_core.py
  pre:scripts/bounded_http_request_overlay.py
  pre:scripts/patch_ps4_notifications.py
  pre:scripts/patch_ps4_l2cap.py
  pre:scripts/patch_foc_observation.py
  pre:scripts/patch_imu_observation.py
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
lib_archive = false
; Compile the standalone integration test and its existing STS servo driver.
build_src_filter = +<main.cpp> +<Servo_STS3032.cpp> +<UartAllocationDiagnostics.cpp>
; User-confirmed initial hold envelope, not mechanical limits. Normal operation stays 0..30%.
build_flags =
  -DLEG_ACCEPT_EXTRA_CONFIRMED=1
  -DLEG_ACCEPT_RIGHT_MIN=1977
  -DLEG_ACCEPT_RIGHT_MAX=2061
  -DLEG_ACCEPT_LEFT_MIN=2026
  -DLEG_ACCEPT_LEFT_MAX=2082
lib_extra_dirs=lib
; Only libraries used by this integration test are included.
lib_deps =
  https://github.com/simplefoc/Arduino-FOC#v2.4.0
  https://github.com/tockn/MPU6050_tockn.git#217f66ba47416ccfc6e4f5048035ac2ee3096fe6
  pablomarquez76/PS4_Controller_Host @ 1.1.1

[env:bus_diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = no_ota.csv
; This opt-in firmware is isolated from the balancing application. It never
; initializes the wheel drivers, MPU6050, Wi-Fi, or gamepad.
build_src_filter = +<bus_diagnostic.cpp>

[env:wheel_diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = no_ota.csv
lib_archive = false
build_src_filter = +<wheel_diagnostic.cpp>
;build_flags = -DSIMPLEFOC_DISABLE_DEBUG
lib_deps = https://github.com/simplefoc/Arduino-FOC#v2.4.0
