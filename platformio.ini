[env:esp32dev]
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = no_ota.csv
lib_archive = false
; Compile the standalone integration test and its existing STS servo driver.
build_src_filter = +<main.cpp> +<Servo_STS3032.cpp>
build_flags =
  -Iinc
lib_extra_dirs=lib
; Only libraries used by this integration test are included.
lib_deps =
  https://github.com/simplefoc/Arduino-FOC#v2.4.0
  https://github.com/tockn/MPU6050_tockn.git
  pablomarquez76/PS4_Controller_Host @ ^1.1.1
